<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseRecord · 我的档案</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page dash">
    <a class="back" href="index.html">← 返回首页</a>

    <div class="brand">CaseRecord · 病例档案</div>

    <nav class="topnav" id="topnav">
      <span class="topnav-slider" aria-hidden="true"></span>
      <a class="topnav-link active" href="dashboard.html">我的档案</a>
      <a class="topnav-link" href="case.html">添加病例</a>
    </nav>

    <!-- 顶部超长信息条：档案 + 病史信息 -->
    <section class="card profile-bar">
      <div class="bar-top">
        <div class="bar-left">
          <div class="avatar" id="avatar"></div>
          <div class="bar-title">
            <h2 id="p-name"></h2>
            <div class="chips" id="p-chips"></div>
            <div class="bar-saved" id="saved-at"></div>
          </div>
        </div>

        <div class="bar-info">
          <div class="info-item">
            <span class="info-label">性别</span>
            <span class="info-value" id="p-gender">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">出生日期</span>
            <span class="info-value" id="p-birth">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">血型</span>
            <span class="info-value" id="p-blood">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">身高</span>
            <span class="info-value" id="p-height">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">体重</span>
            <span class="info-value" id="p-weight">—</span>
          </div>
        </div>

        <div class="bar-actions">
          <a class="btn-edit" href="profile.html">编辑档案</a>
        </div>
      </div>

      <div class="bar-history">
        <div class="section-title">病史信息</div>
        <div class="history-grid">
          <div class="history-item">
            <span class="history-label">既往病史</span>
            <span class="history-text" id="p-history">—</span>
          </div>
          <div class="history-item">
            <span class="history-label">过敏史</span>
            <span class="history-text" id="p-allergy">—</span>
          </div>
          <div class="history-item">
            <span class="history-label">备注</span>
            <span class="history-text" id="p-notes">—</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 病例说明 -->
    <section class="card case-note" id="case-note-section">
      <div class="section-title-row">
        <span class="section-title">病例说明</span>
        <button type="button" class="btn-ai-note" id="btn-ai-note">✦ AI 生成说明</button>
      </div>
      <p class="case-note-tip">针对已有病例的整体说明，可手动编写，也可让 AI 根据全部病例自动生成。</p>
      <textarea id="case-note-input" rows="6" placeholder="在此填写对已有病例的说明…"></textarea>
      <div class="case-note-foot">
        <span class="case-note-hint" id="case-note-hint"></span>
        <button type="button" class="btn-save-note" id="btn-save-note">保存说明</button>
      </div>
    </section>

    <!-- 添加病例 -->
    <div class="add-case-row">
      <a class="btn-add" href="case.html">＋ 添加病例</a>
    </div>

    <!-- 病例记录列表 -->
    <section class="cases-section" id="cases-section" hidden>
      <div class="section-title-row">
        <span class="section-title">病例记录</span>
        <span class="cases-count" id="cases-count"></span>
      </div>
      <div class="cases-list" id="cases-list"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <!-- AI 生成说明结果弹窗（灰色遮罩 + 屏幕上方） -->
  <div class="modal-mask" id="ai-test-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="AI 生成说明">
      <div class="modal-head">
        <div class="modal-title" id="ai-test-title">AI 生成说明</div>
        <button type="button" class="modal-close" id="ai-test-close" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="ai-test-box" id="ai-test-box"></div>
        <div class="ai-test-interpret" id="ai-test-interpret" hidden></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn-cancel ai-test-ok" id="ai-test-ok">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
  <script>
    (function () {
      var nav = document.getElementById("topnav");
      if (!nav) return;
      var links = nav.querySelectorAll(".topnav-link");
      var active = nav.querySelector(".topnav-link.active");
      if (active && links[0] && active !== links[0]) nav.classList.add("second");
    })();
  </script>
</body>
</html>

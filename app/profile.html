<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseRecord · 病例档案</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← 返回首页</a>
    <header>
      <div class="brand">CaseRecord · 病例档案</div>
      <h1>建立患者档案</h1>
      <p class="sub">填写患者基本信息，档案将保存在本机浏览器中。</p>
    </header>

    <form id="profile-form" class="card" novalidate>
      <!-- 基本信息 -->
      <fieldset>
        <div class="group-title">基本信息</div>
        <div class="grid">
          <div class="field">
            <label for="name" class="required">姓名</label>
            <input type="text" id="name" name="name" placeholder="患者姓名" autocomplete="name">
          </div>
          <div class="field">
            <label class="required">性别</label>
            <div class="segmented">
              <input type="radio" name="gender" id="gender-male" value="男" hidden>
              <label for="gender-male">男</label>
              <input type="radio" name="gender" id="gender-female" value="女" hidden>
              <label for="gender-female">女</label>
            </div>
          </div>
          <div class="field span-2">
            <label class="required">出生日期</label>
            <div class="birth-selects">
              <div id="birth-year-slot" aria-label="出生年"></div>
              <div id="birth-month-slot" aria-label="出生月"></div>
              <div id="birth-day-slot" aria-label="出生日"></div>
            </div>
            <small class="hint" id="age-hint"></small>
          </div>
        </div>
      </fieldset>

      <!-- 体征信息 -->
      <fieldset>
        <div class="group-title">体征信息</div>
        <div class="grid grid-3">
          <div class="field">
            <label>血型</label>
            <div id="blood-slot"></div>
          </div>
          <div class="field">
            <label for="height">身高（cm）</label>
            <input type="number" id="height" name="height" min="40" max="250" placeholder="选填">
          </div>
          <div class="field">
            <label for="weight">体重（kg）</label>
            <input type="number" id="weight" name="weight" min="1" max="300" placeholder="选填">
          </div>
        </div>
      </fieldset>

      <!-- 病史信息 -->
      <fieldset>
        <div class="group-title">病史信息</div>
        <div class="grid">
          <div class="field span-2">
            <label for="history">既往病史</label>
            <textarea id="history" name="history" rows="3" placeholder="选填，如：高血压、糖尿病等"></textarea>
          </div>
          <div class="field span-2">
            <label for="allergy">过敏史</label>
            <textarea id="allergy" name="allergy" rows="2" placeholder="选填，如：青霉素过敏"></textarea>
          </div>
          <div class="field span-2">
            <label for="notes">备注</label>
            <textarea id="notes" name="notes" rows="2" placeholder="选填，其他需要说明的信息"></textarea>
          </div>
        </div>
      </fieldset>

      <!-- AI 大模型配置 -->
      <fieldset>
        <div class="group-title">AI 大模型配置</div>
        <div class="grid">
          <div class="field span-2">
            <label for="ai-base" class="required">API 地址</label>
            <input type="text" id="ai-base" placeholder="如 https://api.deepseek.com/v1" autocomplete="off">
          </div>
          <div class="field span-2">
            <label class="required">模型</label>
            <div id="ai-model-slot"></div>
          </div>
          <div class="field span-2">
            <label for="ai-key" class="required">API Key</label>
            <input type="password" id="ai-key" placeholder="sk-…" autocomplete="off">
          </div>
        </div>
      </fieldset>

      <div class="submit-row">
        <button type="submit" class="btn-submit" id="btn-submit">保存档案</button>
      </div>
    </form>

    <!-- 已保存档案摘要 -->
    <section class="summary" id="saved-summary" hidden>
      <div>
        <div class="summary-label">当前本地档案</div>
        <div class="summary-meta" id="summary-meta"></div>
      </div>
      <button type="button" class="clear" id="btn-clear">清除本地档案</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <!-- AI 连接检测结果弹窗（灰色遮罩 + 屏幕上方） -->
  <div class="modal-mask" id="ai-test-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="AI 连接检测">
      <div class="modal-head">
        <div class="modal-title" id="ai-test-title">AI 连接检测</div>
        <button type="button" class="modal-close" id="ai-test-close" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="ai-test-box" id="ai-test-box"></div>
        <div class="ai-test-interpret" id="ai-test-interpret" hidden></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn-cancel ai-test-ok" id="ai-test-ok">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>

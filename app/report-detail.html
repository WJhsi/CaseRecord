<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseRecord · 报告详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page dash">
    <a class="back" href="#" id="back-link">← 返回病例详情</a>

    <div class="brand">CaseRecord · 病例档案</div>

    <nav class="topnav">
      <span class="topnav-slider" aria-hidden="true"></span>
      <a class="topnav-link active" href="dashboard.html">我的档案</a>
      <a class="topnav-link" href="case.html">添加病例</a>
    </nav>

    <header>
      <h1>报告详情</h1>
      <p class="sub" id="report-meta"></p>
    </header>

    <!-- 报告 + AI 解析：两栏布局 -->
    <section class="card report-layout">
      <!-- 左栏：原始报告 -->
      <div class="report-left">
        <div class="section-title">原始报告</div>
        <div id="report-content"></div>
      </div>

      <!-- 右栏：AI 识别文字（视觉模型 OCR）+ AI 解析 -->
      <div class="report-right">
        <div class="ai-parse">
          <div class="section-title-row">
            <span class="section-title">AI 解析</span>
            <div class="case-note-head-actions">
              <span class="note-timer" id="ai-timer" hidden></span>
              <button type="button" class="btn-ai-note" id="btn-ai-ocr">✦ AI 识别文字</button>
              <button type="button" class="btn-ai-note" id="btn-ai-parse">✦ AI 解析</button>
            </div>
          </div>
          <p class="case-note-tip">第一步：AI 直接查看报告原图并转为文字（可核对、修正）；第二步：基于文字进行 AI 解析。识别文字需使用支持图片输入的视觉模型。</p>

          <div class="ocr-text-title">识别文字 <span class="ocr-check-tag">AI 看图转文字</span></div>
          <textarea id="ai-ocr-text" rows="8" placeholder="点击「AI 识别文字」，AI 将把报告原图转为文字，可手动修正…"></textarea>

          <div class="ocr-text-title" style="margin-top:1rem">AI 解析 <span class="ocr-check-tag">基于文字</span></div>
          <textarea id="ai-parse-result" rows="8" readonly placeholder="点击「AI 解析」，基于上方识别文字自动解析…"></textarea>

          <div class="case-note-foot">
            <span class="case-note-meta" id="ai-meta">Token 用量：— · 生成时间：—</span>
            <span class="case-note-hint" id="ai-hint"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <!-- AI 解析结果弹窗（灰色遮罩 + 屏幕上方） -->
  <div class="modal-mask" id="ai-test-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="AI 解析">
      <div class="modal-head">
        <div class="modal-title" id="ai-test-title">AI 解析</div>
        <button type="button" class="modal-close" id="ai-test-close" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="ai-test-box" id="ai-test-box"></div>
        <div class="ai-test-interpret" id="ai-test-interpret" hidden></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn-cancel ai-test-ok" id="ai-test-ok">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/report-detail.js"></script>
</body>
</html>

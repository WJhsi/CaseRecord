<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseRecord · 报告详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page dash">
    <a class="back" href="#" id="back-link">← 返回病例详情</a>

    <div class="brand">CaseRecord · 病例档案</div>

    <nav class="topnav">
      <a class="topnav-link" href="dashboard.html">我的档案</a>
      <a class="topnav-link" href="case.html">添加病例</a>
    </nav>

    <header>
      <h1>报告详情</h1>
      <p class="sub" id="report-meta"></p>
    </header>

    <!-- 报告查看区 -->
    <section class="card report-view">
      <div id="report-content"></div>
    </section>

    <!-- OCR 识别区（打开页面自动识别） -->
    <section class="card ocr-section" id="ocr-section" hidden>
      <div class="section-title">检验报告识别</div>
      <div class="ocr-warning">⚠ OCR 可能无法完全或错误识别，可能会影响 AI 判断，请注意辨别。</div>
      <div class="ocr-note">目前仅支持血常规识别，其他报告可查看下方识别原文。</div>
      <div id="ocr-status" class="ocr-status" hidden></div>

      <div id="ocr-table-wrap" hidden>
        <table class="ocr-table">
          <thead>
            <tr>
              <th>项目</th>
              <th>结果</th>
              <th>单位</th>
              <th>参考范围</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="ocr-tbody"></tbody>
        </table>
      </div>

      <div id="ocr-raw-wrap" hidden>
        <div class="ocr-raw-title">识别原文</div>
        <pre class="ocr-raw" id="ocr-raw"></pre>
      </div>
    </section>
  </main>

  <script type="module" src="js/report-ocr.js"></script>
  <script src="js/report-detail.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseRecord · 报告详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page dash">
    <a class="back" href="#" id="back-link">← 返回病例详情</a>

    <div class="brand">CaseRecord · 病例档案</div>

    <nav class="topnav">
      <span class="topnav-slider" aria-hidden="true"></span>
      <a class="topnav-link active" href="dashboard.html">我的档案</a>
      <a class="topnav-link" href="case.html">添加病例</a>
    </nav>

    <header>
      <h1>报告详情</h1>
      <p class="sub" id="report-meta"></p>
    </header>

    <!-- 报告 + OCR 识别结果：两栏布局 -->
    <section class="card report-layout">
      <!-- 左栏：原始报告 -->
      <div class="report-left">
        <div class="section-title">原始报告</div>
        <div id="report-content"></div>
      </div>

      <!-- 右栏：OCR 识别结果 -->
      <div class="report-right">
        <div id="ocr-section">
          <div class="ocr-warning">⚠ OCR 可能无法完全或错误识别，可能会影响 AI 判断，请注意辨别。</div>
          <div class="ocr-note-row">
            <div class="ocr-note">图片报告支持自动识别；检验报告按血常规清单解析，检查报告识别整段报告文字。</div>
            <div class="ocr-mode" id="ocr-mode">
              <span class="mode-slider" aria-hidden="true"></span>
              <button type="button" class="mode-btn active" id="mode-auto">自动输入</button>
              <button type="button" class="mode-btn" id="mode-manual">手动输入</button>
            </div>
          </div>
          <div id="ocr-status" class="ocr-status" hidden></div>

          <div id="ocr-table-wrap" hidden>
            <table class="ocr-table">
              <thead>
                <tr>
                  <th>项目</th>
                  <th>结果</th>
                  <th>单位</th>
                  <th>参考范围</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="ocr-tbody"></tbody>
            </table>
            <div class="ocr-actions">
              <button type="button" class="btn-save-ocr" id="ocr-save">保存识别结果</button>
              <button type="button" class="btn-rerun" id="ocr-rerun">重新识别</button>
            </div>
          </div>

          <!-- 检查报告：影像表现（OCR）+ 影像判断（手动填写，不识别） -->
          <div id="ocr-text-wrap" hidden>
            <div class="ocr-check-cols">
              <div class="ocr-check-col">
                <div class="ocr-check-title">影像表现 <span class="ocr-check-tag">OCR 识别</span></div>
                <textarea id="ocr-textarea" rows="12" placeholder="由 OCR 自动识别的影像表现文字，可切换「手动输入」修改…"></textarea>
              </div>
              <div class="ocr-check-col">
                <div class="ocr-check-title">影像判断 <span class="ocr-check-tag">手动填写</span></div>
                <textarea id="ocr-impression" rows="12" placeholder="影像判断/结论，手动填写，不做 OCR 识别…"></textarea>
              </div>
            </div>
            <div class="ocr-actions">
              <button type="button" class="btn-save-ocr" id="ocr-save-text">保存识别结果</button>
              <button type="button" class="btn-rerun" id="ocr-rerun-text">重新识别</button>
            </div>
          </div>

          <!-- 识别原文：默认折叠，点击展开 -->
          <details class="ocr-raw-details" id="ocr-raw-wrap">
            <summary>识别原文（点击展开）</summary>
            <pre class="ocr-raw" id="ocr-raw"></pre>
          </details>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/report-ocr.js"></script>
  <script src="js/report-detail.js"></script>
</body>
</html>

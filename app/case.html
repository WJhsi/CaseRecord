<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseRecord · 添加病例</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page dash">
    <a class="back" href="dashboard.html" id="back-link">← 返回个人主页</a>
    <div class="brand">CaseRecord · 病例档案</div>

    <nav class="topnav">
      <a class="topnav-link" href="dashboard.html">我的档案</a>
      <a class="topnav-link active" href="case.html">添加病例</a>
    </nav>

    <header>
      <h1 id="page-title">添加病例</h1>
      <p class="sub" id="page-sub">记录病情、上传影像报告、录入用药。</p>
    </header>

    <form id="case-form" class="card" novalidate>
      <!-- 病情描述：下拉病情 + 填写问诊病例 -->
      <fieldset>
        <div class="group-title">病情描述</div>
        <div class="grid">
          <div class="field">
            <label class="required">下拉病情</label>
            <div id="illness-slot"></div>
            <small class="hint">选择病情类型，也可搜索或自定义输入</small>
          </div>
          <div class="field">
            <label for="condition" class="required">填写问诊病例</label>
            <textarea id="condition" name="condition" rows="6" placeholder="详细描述症状、诊断、就诊过程等…"></textarea>
          </div>
        </div>
      </fieldset>

      <!-- 检验报告 / 检查报告 -->
      <fieldset>
        <div class="group-title">检验报告 / 检查报告</div>
        <div class="grid">
          <div class="field span-2">
            <input type="file" id="report-files" name="report-files" accept="image/*,.pdf" multiple hidden>
            <button type="button" class="upload-btn" id="upload-trigger">＋ 选择报告文件（图片 / PDF）</button>
            <small class="hint" id="upload-hint">支持 jpg / png / webp / gif / pdf，单个文件不超过 2MB</small>
            <div class="upload-preview" id="upload-preview"></div>
          </div>
        </div>
      </fieldset>

      <!-- 药物 -->
      <fieldset>
        <div class="group-title">药物</div>
        <div class="grid" id="med-list">
          <!-- 药物行由 JS 生成 -->
        </div>
        <button type="button" class="add-med" id="add-med">＋ 添加药物</button>
      </fieldset>

      <div class="submit-row">
        <button type="submit" class="btn-submit" id="btn-submit">保存病例</button>
      </div>
    </form>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/case.js"></script>
</body>
</html>

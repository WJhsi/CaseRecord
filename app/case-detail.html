<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaseRecord · 病例详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="theme-toggle" id="theme-toggle" role="group" aria-label="主题切换">
    <span class="theme-slider" aria-hidden="true"></span>
    <button type="button" class="theme-btn active" data-theme="light" title="浅色模式" aria-label="浅色模式">
      <svg viewBox="0 0 24 24"  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <button type="button" class="theme-btn" data-theme="dark" title="深色模式" aria-label="深色模式">
      <svg viewBox="0 0 24 24"  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <main class="page dash">
    <a class="back" href="dashboard.html">← 返回个人主页</a>

    <div class="brand">CaseRecord · 病例档案</div>

    <nav class="topnav">
      <span class="topnav-slider" aria-hidden="true"></span>
      <a class="topnav-link active" href="dashboard.html">我的档案</a>
      <a class="topnav-link" href="case.html">添加病例</a>
    </nav>

    <header>
      <div class="header-row">
        <div>
          <h1>病例详情</h1>
          <p class="sub" id="detail-date"></p>
        </div>
        <div class="header-actions">
          <a class="btn-edit-detail" id="btn-edit-case" href="#">编辑病例</a>
          <button type="button" class="btn-danger" id="btn-delete-case">删除病例</button>
        </div>
      </div>
    </header>

    <!-- 病例详情：病情 / 影像 / 药物 合并为一个大块 -->
    <section class="card detail-card">
      <div class="detail-block">
        <div class="section-title">病情描述</div>
        <div class="detail-illness" id="detail-illness" hidden></div>
        <p class="detail-cond" id="detail-cond"></p>
      </div>

      <div class="detail-block">
        <div class="section-title">检验报告 / 检查报告</div>
        <div class="detail-images" id="detail-images"></div>
      </div>

      <div class="detail-block">
        <div class="section-title">药物</div>
        <div class="detail-meds" id="detail-meds"></div>
      </div>

      <div class="detail-block">
        <div class="section-title">外科治疗方案</div>
        <div class="detail-treatment" id="detail-treatment"></div>
      </div>
    </section>
  </main>

  <!-- 删除病例确认弹窗（必须在 script 之前，JS 才能绑定事件） -->
  <div class="modal-mask" id="delete-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="删除病例确认">
      <div class="modal-head">
        <div class="modal-title">删除病例</div>
        <button type="button" class="modal-close" id="delete-cancel-x" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-warn">
          删除后将<strong>永久移除</strong>这条病例的病情描述、检验 / 检查报告与药物记录，且<strong>无法恢复</strong>。
        </p>
        <p class="modal-hint">请确认是否继续删除？</p>
        <div class="modal-field">
          <label for="delete-verify">请输入「我确认删除」以启用删除按钮</label>
          <input type="text" id="delete-verify" placeholder="我确认删除" autocomplete="off">
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn-cancel" id="delete-cancel">取消</button>
          <button type="button" class="modal-btn-danger" id="delete-confirm" disabled>确认删除（5s）</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/case-detail.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>

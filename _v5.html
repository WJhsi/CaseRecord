<!DOCTYPE html><html><head><meta charset='utf-8'><link rel='stylesheet' href='http://localhost:8081/css/style.css?v=1786878853'></head><body>
<div class='theme-toggle' id='theme-toggle' role='group' aria-label='主题切换'>
  <span class='theme-slider' aria-hidden='true'></span>
  <button type='button' class='theme-btn active' data-theme='light' title='浅色模式'>☀</button>
  <button type='button' class='theme-btn' data-theme='dark' title='深色模式'>☾</button>
</div>
<script src='http://localhost:8081/js/theme.js?v=1786878853'></script>
<script>
setTimeout(function(){ document.querySelector('[data-theme="dark"]').click(); }, 400);
</script>
</body></html>
